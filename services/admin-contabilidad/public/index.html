<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin & Contabilidad — Panel de Pruebas</title>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #1a1d27;
    --bg3: #22263a;
    --border: #2e3350;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 240px; min-width: 240px; background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  #sidebar h1 { padding: 20px 16px 8px; font-size: 13px; font-weight: 700; color: var(--accent2); text-transform: uppercase; letter-spacing: 1px; }
  .nav-section { padding: 6px 0; border-bottom: 1px solid var(--border); }
  .nav-section-title { padding: 8px 16px 4px; font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .nav-btn {
    display: block; width: 100%; text-align: left; padding: 8px 20px;
    background: none; border: none; color: var(--text); cursor: pointer; font-size: 13px;
    border-left: 3px solid transparent; transition: all .15s;
  }
  .nav-btn:hover { background: var(--bg3); color: var(--accent2); }
  .nav-btn.active { background: var(--bg3); border-left-color: var(--accent); color: var(--accent2); font-weight: 600; }

  /* ── URL BAR ── */
  #url-bar { padding: 12px 16px; background: var(--bg3); border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  #url-bar label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  #base-url { flex: 1; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--text); font-size: 12px; }
  #token-bar { padding: 8px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  #token-bar label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  #token-display { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; color: var(--green); font-size: 11px; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #clear-token { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
  #clear-token:hover { border-color: var(--red); color: var(--red); }

  /* ── MAIN ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #content { flex: 1; overflow-y: auto; padding: 24px; display: flex; gap: 20px; }

  /* ── PANEL ── */
  .panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; flex: 1; min-width: 0; }
  .panel h2 { font-size: 14px; font-weight: 700; color: var(--accent2); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .panel h2 span.badge { background: var(--bg3); color: var(--muted); font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500; }

  /* ── FORM ── */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; color: var(--text); font-size: 13px; font-family: inherit;
    transition: border-color .15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 100px; font-family: 'Courier New', monospace; font-size: 12px; }

  /* ── BUTTONS ── */
  .btn { padding: 8px 18px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #5a52d5; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent2); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

  /* ── METHOD BADGES ── */
  .method { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-right: 6px; }
  .GET    { background: #064e3b; color: #6ee7b7; }
  .POST   { background: #1e3a5f; color: #93c5fd; }
  .PATCH  { background: #3b1f64; color: #c4b5fd; }
  .PUT    { background: #422006; color: #fbbf24; }
  .DELETE { background: #450a0a; color: #fca5a5; }

  /* ── RESPONSE ── */
  #response-panel { width: 420px; min-width: 320px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
  #response-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  #response-header h3 { font-size: 13px; color: var(--muted); }
  #status-badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .s-2xx { background: #14532d; color: #86efac; }
  .s-4xx { background: #450a0a; color: #fca5a5; }
  .s-5xx { background: #431407; color: #fdba74; }
  .s-0   { background: var(--bg3); color: var(--muted); }
  #response-meta { padding: 8px 16px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border); display: flex; gap: 16px; }
  #response-body { flex: 1; overflow-y: auto; padding: 16px; }
  #response-body pre { font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; color: var(--text); }

  /* ── TABS ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab { padding: 7px 14px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 600; transition: all .15s; margin-bottom: -1px; }
  .tab.active { color: var(--accent2); border-bottom-color: var(--accent); }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* ── ENDPOINT LIST ── */
  .ep-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); gap: 8px; cursor: pointer; transition: background .1s; border-radius: 4px; padding-left: 4px; }
  .ep-item:hover { background: var(--bg3); }
  .ep-path { font-size: 12px; color: var(--text); font-family: monospace; }
  .ep-desc { font-size: 11px; color: var(--muted); margin-left: auto; }

  /* ── UTIL ── */
  .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .tag { display: inline-block; background: var(--bg3); color: var(--accent2); font-size: 10px; padding: 2px 8px; border-radius: 20px; margin: 2px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<script>
// ── STATE ────────────────────────────────────────────────────
let TOKEN = localStorage.getItem('adm_token') || '';
updateTokenDisplay();

function base() { return document.getElementById('base-url').value.replace(/\/$/, ''); }

function clearToken() {
  TOKEN = '';
  localStorage.removeItem('adm_token');
  updateTokenDisplay();
}
function updateTokenDisplay() {
  const el = document.getElementById('token-display');
  if (TOKEN) { el.textContent = TOKEN.substring(0, 60) + '...'; el.style.color = 'var(--green)'; }
  else { el.textContent = 'Sin token — haz login primero'; el.style.color = 'var(--muted)'; }
}

// ── HTTP ─────────────────────────────────────────────────────
async function req(method, path, body, useToken = true) {
  const url = base() + path;
  const headers = { 'Content-Type': 'application/json' };
  if (useToken && TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;

  const statusEl  = document.getElementById('status-badge');
  const preEl     = document.getElementById('resp-pre');
  const methodEl  = document.getElementById('resp-method');
  const timeEl    = document.getElementById('resp-time');

  statusEl.className = 's-0'; statusEl.textContent = '...';
  methodEl.textContent = method + ' ' + path;
  preEl.innerHTML = '<span class="spinner"></span>';

  const t0 = Date.now();
  try {
    const opts = { method, headers };
    if (body && method !== 'GET') opts.body = JSON.stringify(body);
    const r = await fetch(url, opts);
    const ms = Date.now() - t0;
    const text = await r.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }

    statusEl.textContent = r.status;
    statusEl.className = r.status < 300 ? 's-2xx' : r.status < 500 ? 's-4xx' : 's-5xx';
    timeEl.textContent = ms + ' ms';
    preEl.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);

    // Auto-save token
    if (data?.token) { TOKEN = data.token; localStorage.setItem('adm_token', TOKEN); updateTokenDisplay(); }
    if (data?.data?.token) { TOKEN = data.data.token; localStorage.setItem('adm_token', TOKEN); updateTokenDisplay(); }

    return data;
  } catch (err) {
    statusEl.textContent = 'ERROR'; statusEl.className = 's-5xx';
    timeEl.textContent = (Date.now() - t0) + ' ms';
    preEl.textContent = err.message + '\n\n¿El servidor está corriendo en ' + base() + '?';
    return null;
  }
}

// ── NAVIGATION ───────────────────────────────────────────────
function showSection(name) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('left-panel').innerHTML = sections[name]?.() || '<p>Sección no encontrada</p>';
}

// ── HELPER UI ────────────────────────────────────────────────
function field(id, label, type = 'text', value = '', placeholder = '') {
  if (type === 'json') return `<div class="field"><label>${label}</label><textarea id="${id}" rows="5">${value}</textarea></div>`;
  if (type === 'select') return '';
  return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${value}" placeholder="${placeholder}"></div>`;
}
function val(id) { return document.getElementById(id)?.value || ''; }
function json(id) { try { return JSON.parse(val(id)); } catch { alert('JSON inválido en ' + id); return null; } }

// ── ACTIONS ──────────────────────────────────────────────────
function doLogin() {
  req('POST', '/api/auth/login', { email: val('l-email'), password: val('l-pass') }, false);
}
function doRegister() {
  req('POST', '/api/auth/register', {
    nombre: val('r-nombre'), apellidos: val('r-apellidos'),
    email: val('r-email'), password: val('r-pass'), tipo_usuario: val('r-tipo'), rol: 'admin'
  }, false);
}
function doMvCreate() { const b = json('mv-json'); if (b) req('POST', '/api/movimientos', b); }
function doCobro()    { const b = json('co-json'); if (b) req('POST', '/api/payments', b); }
function doReembolso(){ const b = json('re-json'); if (b) req('POST', '/api/reembolsos', b); }
function doCompensacion() { const b = json('comp-json'); if (b) req('POST', '/api/compensaciones', b); }
function doPago()     { const b = json('pa-json'); if (b) req('POST', '/api/pagos-agentes', b); }
function doCupon()    { const b = json('cup-json'); if (b) req('POST', '/api/cupones/lealtad', b); }
function doFlash()    { const b = json('pr-flash-json'); if (b) req('POST', '/api/promociones-flash', b); }

function doChatsWebhook() {
  req('POST', '/api/chats/resolucion', {
    conversation_id:  val('ch-conv-id'),
    tipo_resolucion:  val('ch-tipo'),
    requester_type:   val('ch-req-type'),
    requester_ext_id: val('ch-req-ext'),
    case_type:        val('ch-case'),
    case_reference:   val('ch-ref')
  });
}
function doChatsProc() {
  const remId  = val('ch-proc-rem')  ? Number(val('ch-proc-rem'))  : null;
  const compId = val('ch-proc-comp') ? Number(val('ch-proc-comp')) : null;
  req('PATCH', '/api/chats/resoluciones/' + val('ch-proc-id') + '/procesar',
    { reembolso_id: remId, compensacion_id: compId, notas: val('ch-proc-nota') });
}

// ── TABS ─────────────────────────────────────────────────────
function switchTab(btn, paneId) {
  const container = btn.closest('.panel') || document.getElementById('left-panel');
  container.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  container.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(paneId)?.classList.add('active');
}

// ── INIT ─────────────────────────────────────────────────────
document.getElementById('left-panel').innerHTML = sections.auth();
</script>
